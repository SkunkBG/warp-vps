name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck --severity=warning warp-vps.sh
      - name: Smoke test the generator against a fixture account
        run: |
          set -euo pipefail
          ./warp-vps.sh generate -a tests/fixtures/account.json | jq -e '
            .protocol == "wireguard"
            and (.settings.reserved | length) == 3
            and .settings.mtu == 1280
            and .settings.noKernelTun == true
          ' > /dev/null
          ./warp-vps.sh generate -a tests/fixtures/account.json --ipv6 --full \
            | jq -e '.outbounds[0].settings.address | length == 2' > /dev/null
          ./warp-vps.sh generate -a tests/fixtures/account.json --no-reserved \
            | jq -e 'has("settings") and (.settings | has("reserved") | not)' > /dev/null
          echo "generator output OK"
      - name: Smoke test the merge splicer
        run: |
          set -euo pipefail
          cat > /tmp/cfg.json <<'EOF'
          {"outbounds":[{"tag":"DIRECT","protocol":"freedom"},{"tag":"BLOCK","protocol":"blackhole"}],
           "routing":{"rules":[{"type":"field","domain":["geosite:private"],"outboundTag":"BLOCK"},
                               {"type":"field","network":"tcp,udp","outboundTag":"DIRECT"}]}}
          EOF
          ./warp-vps.sh merge -c /tmp/cfg.json -a tests/fixtures/account.json             --rules "geosite:openai" --dry-run > /tmp/out.json
          # The outbound must never become index 0 (that is Xray's default handler),
          # and the rule must land above the catch-all, not after it.
          jq -e '.outbounds[0].tag == "DIRECT" and .outbounds[-1].tag == "warp"' /tmp/out.json > /dev/null
          jq -e '([.routing.rules[].outboundTag] | index("warp")) < ([.routing.rules[].outboundTag] | index("DIRECT"))' /tmp/out.json > /dev/null
          echo "merge placement OK"
      - name: The built-in "ai" preset must match templates/rules-ai.json
        run: |
          set -euo pipefail
          # The script embeds the list so a curl-piped run needs no repo files;
          # the template documents it. They must not drift.
          diff <(./warp-vps.sh generate -a tests/fixtures/account.json --rules ai --full                    | jq -r '.routing.rules[0].domain[]')                <(jq -r '.rule.domain[]' templates/rules-ai.json)
          diff <(./warp-vps.sh generate -a tests/fixtures/account.json --rules ai --full                    | jq -r '.routing.rules[0].domain | join(",")')                <(jq -r '._csv' templates/rules-ai.json)
          echo "ai preset in sync"
