name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck --severity=warning warp-vps.sh

      - name: Outbound is a freedom outbound bound to the interface
        run: |
          set -euo pipefail
          ./warp-vps.sh outbound | jq -e '
            .protocol == "freedom"
            and .streamSettings.sockopt.interface == "warp"
            and (has("settings"))
          ' > /dev/null
          # Nothing secret may end up in a config that gets pasted into a panel.
          ./warp-vps.sh outbound | grep -qiE 'secretKey|privateKey|reserved' && exit 1
          echo "outbound OK"

      - name: The built-in "ai" preset matches templates/rules-ai.json
        run: |
          set -euo pipefail
          diff <(./warp-vps.sh outbound --rules ai --full 2>/dev/null | jq -r '.routing.rules[0].domain[]') \
               <(jq -r '.rule.domain[]' templates/rules-ai.json)
          diff <(./warp-vps.sh outbound --rules ai --full 2>/dev/null | jq -r '.routing.rules[0].domain | join(",")') \
               <(jq -r '._csv' templates/rules-ai.json)
          echo "ai preset in sync"

      - name: Merge never makes warp the default outbound, and beats the catch-all
        run: |
          set -euo pipefail
          cat > /tmp/cfg.json <<'EOF'
          {"outbounds":[{"tag":"DIRECT","protocol":"freedom"},{"tag":"BLOCK","protocol":"blackhole"}],
           "routing":{"rules":[{"type":"field","domain":["geosite:private"],"outboundTag":"BLOCK"},
                               {"type":"field","network":"tcp,udp","outboundTag":"DIRECT"}]}}
          EOF
          ./warp-vps.sh merge -c /tmp/cfg.json --rules ai --dry-run > /tmp/out.json
          # Unmatched traffic goes to outbounds[0]; ours must never be it.
          jq -e '.outbounds[0].tag == "DIRECT" and .outbounds[-1].tag == "warp"' /tmp/out.json > /dev/null
          # Xray takes the first matching rule, so ours must precede the catch-all.
          jq -e '([.routing.rules[].outboundTag] | index("warp")) < ([.routing.rules[].outboundTag] | index("DIRECT"))' /tmp/out.json > /dev/null
          # --replace must not duplicate the outbound or the rule.
          ./warp-vps.sh merge -c /tmp/out.json --all-traffic --replace --dry-run \
            | jq -e '([.outbounds[]|select(.tag=="warp")]|length == 1)
                     and ([.routing.rules[]|select(.outboundTag=="warp")]|length == 1)' > /dev/null
          echo "merge placement OK"

      - name: Guards refuse the dangerous cases
        run: |
          set -euo pipefail
          fails=0
          ! ./warp-vps.sh merge -c /tmp/cfg.json --dry-run           2>/dev/null || fails=1  # no rule selector
          ! ./warp-vps.sh outbound --rules ai --all-traffic          2>/dev/null || fails=1  # mutually exclusive
          echo '{"outbounds":[]}' > /tmp/empty.json
          ! ./warp-vps.sh merge -c /tmp/empty.json --all-traffic --dry-run 2>/dev/null || fails=1
          mkdir -p /tmp/opt/remnanode && cp /tmp/cfg.json /tmp/opt/remnanode/config.json
          ! ./warp-vps.sh merge -c /tmp/opt/remnanode/config.json --all-traffic --dry-run 2>/dev/null || fails=1
          [ "$fails" -eq 0 ] && echo "guards OK"
